branches:
  - main
  - "+([0-9])?(.{+([0-9]),x}).x"   # maintenance branches: 1.x, 2.x, etc.

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      # This is a project scaffold, not a published artifact — only functional
      # changes (feat/fix/perf) cut a release. docs/chore are recorded in the
      # changelog (below) but do not trigger a release on their own.
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            section: Features
          - type: fix
            section: Bug Fixes
          - type: perf
            section: Performance Improvements
          - type: docs
            section: Documentation
  - - "@semantic-release/changelog"
    - changelogFile: CHANGELOG.md
  - - "@semantic-release/github"
  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
      message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
